name: MONIFlow EAS Simulator Access — Cloud

# Access check only: this workflow MUST NOT start, build, fund, sign, or deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moniflow-expo-simulator-access-check
  cancel-in-progress: false

jobs:
  check-expo-simulator-access:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
      EAS_CLI_DISABLE_TELEMETRY: "1"
    steps:
      - name: Require existing Expo connection
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing. Add it to GitHub Actions repository secrets. Never paste it into the workflow input or chat."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate MONIFlow project and access-only workflow
        run: node --test scripts/phase27-eas-simulator-access.nodecheck.mjs
      - name: Check EAS Simulator eligibility without starting a session
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest simulator:availability --json > "$RUNNER_TEMP/moniflow-simulator-access.json"
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const raw = fs.readFileSync(path.join(process.env.RUNNER_TEMP, "moniflow-simulator-access.json"), "utf8");
          let data;
          try { data = JSON.parse(raw); } catch { throw new Error("EXPO_SIMULATOR_ACCESS_UNREADABLE: no simulator session requested"); }
          const available = data.available === true;
          const unavailable = data.available === false;
          if (!available && !unavailable) throw new Error("EXPO_SIMULATOR_ACCESS_UNKNOWN: no simulator session requested");
          const status = available ? "AVAILABLE" : "NOT AVAILABLE";
          process.stdout.write("MONIFLOW_EAS_SIMULATOR_ACCESS=" + status + "\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "## MONIFlow EAS Simulator access check\n" +
            "- Expo project: [@xpen/moniflow](https://expo.dev/accounts/xpen/projects/moniflow)\n" +
            "- EAS remote simulator eligibility: **" + status + "**\n" +
            "- This checked your Expo token/account only.\n" +
            "- **No simulator session, chargeable runtime, build, deployment, wallet or financial operation was started.**\n" +
            "- Existing finished [iOS Simulator build](https://expo.dev/accounts/xpen/projects/moniflow/builds/aee7b52f-2ae1-431a-9e02-bef7d012ebd4) remains unchanged.\n");
          NODE
