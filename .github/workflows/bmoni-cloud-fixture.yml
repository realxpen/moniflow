name: MONIFlow BMONI Sandbox Fixture — Cloud

# Owner-initiated real BMONI sandbox user tests only. No automatic provider user creation.
on:
  # Run safe read-only sandbox connectivity automatically when THIS workflow changes on main.
  # No push can create a user: source gate permits writes on workflow_dispatch only.
  push:
    branches: [main]
    paths:
      - ".github/workflows/bmoni-cloud-fixture.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "BMONI sandbox operation (single action per run)"
        type: choice
        required: true
        default: connectivity
        options:
          - connectivity
          - create-fixture
          - create-custom-user
          - inspect-user
      acknowledgment:
        description: "For create-custom-user enter CREATE_ONE_MONIFLOW_BMONI_SANDBOX_USER (create-fixture uses its original exact acknowledgment)"
        required: false
        type: string
      bmoni_user_id:
        description: "For inspect-user ONLY: BMONI sandbox test user's ID"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Serializes all BMONI sandbox creation/inspection runs; no concurrency retry.
  group: moniflow-bmoni-known-sandbox-fixture
  cancel-in-progress: false

jobs:
  sandbox-fixture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep host fixed to the explicitly documented shared-key development environment.
      FINANCIAL_PROVIDER: bmoni
      BMONI_BASE_URL: https://embedded-dev.bmoni.com
      MONIFLOW_FIXTURE_ACTION: ${{ inputs.action || 'connectivity' }}
      MONIFLOW_FIXTURE_ACKNOWLEDGMENT: ${{ inputs.acknowledgment }}
      MONIFLOW_FIXTURE_USER_ID: ${{ inputs.bmoni_user_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies using MONIFlow CI policy
        run: pnpm install --no-frozen-lockfile
      - name: Verify required cloud checks before provider access
        run: pnpm typecheck && pnpm test
      - name: Execute exactly one approved BMONI sandbox stage
        shell: bash
        env:
          NODE_ENV: development
        run: pnpm --filter @moniflow/api lab:bmoni:cloud
