name: MONIFlow iPhone PWA - One Intent Lab Preview

on:
  pull_request:
    paths:
      - .github/workflows/iphone-pwa-intent-lab-once.yml
      - docs/RC_IPHONE_PWA_INTENT_LAB_ONE_SHOT_20261024.md
  push:
    branches: [main]
    paths:
      - docs/RC_IPHONE_PWA_INTENT_LAB_ONE_SHOT_20261024.md

permissions:
  contents: read

concurrency:
  group: moniflow-iphone-pwa-intent-lab-20261024
  cancel-in-progress: false

jobs:
  api-preview-probe:
    if: github.event_name == 'pull_request' && github.repository == 'realxpen/moniflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify new isolated API build, JWT boundary and existing PWA origin
        env:
          PREVIEW_API: https://moniflow-sandbox-staging-5sbbss3ky-swifnatechnologyltd.vercel.app
        run: |
          node --input-type=module - <<'NODE'
          const base = process.env.PREVIEW_API;
          const old = "https://xpen-moniflow-pwa-202610--vxgwelbarp.expo.app";
          async function req(path, method, origin, body) {
            const r = await fetch(base + path, {
              method, redirect: 'manual',
              headers: { origin, 'content-type': 'application/json',
                ...(method === 'OPTIONS' ? {
                  'access-control-request-method': 'POST',
                  'access-control-request-headers': 'authorization,content-type'
                } : {}) },
              ...(body ? {body} : {})
            });
            return r;
          }
          const health=await req('/health/provider','GET',old);
          if(health.status !== 200 || health.headers.get('access-control-allow-origin') !== old)
            throw Error('New API missing old origin and provider health');
          const state=await health.json();
          if(state.provider !== 'moniflow-sandbox' || state.simulated !== true ||
             state.authenticatedSandboxDemoEnabled !== true ||
             state.partnerRegistrationEnabled !== false) throw Error('Non-sandbox provider build');
          const guarded=await req('/api/sandbox-demo/preview','POST',old,'{}');
          if(guarded.status !== 401 || (await guarded.json()).code !== 'AUTH_REQUIRED' ||
             guarded.headers.get('access-control-allow-origin') !== old) throw Error('Preview route not JWT-protected');
          const preflight=await req('/api/sandbox-demo/preview','OPTIONS',old);
          if(preflight.status !== 204 ||
             preflight.headers.get('access-control-allow-origin') !== old) throw Error('PWA preflight failed HTTP '+preflight.status+' allow '+preflight.headers.get('access-control-allow-origin')+' content-type '+preflight.headers.get('content-type'));
          const alien=await req('/health/provider','GET','https://foreign.example');
          if(alien.headers.get('access-control-allow-origin') !== null) throw Error('Wildcard/foreign CORS allowed');
          console.log('PASS: backend preview route, protected 401, existing PWA CORS, foreign denial');
          NODE
  verify-and-host:
    if: github.event_name == 'push' && github.repository == 'realxpen/moniflow' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      PINNED_APP_SOURCE: 4529e96956d57217a290b254a3214d92398a9199
      PREVIOUS_MAIN: ${{ github.event.before }}
      EXPO_PUBLIC_MONIFLOW_PWA_PREVIEW: "1"
      EXPO_PUBLIC_API_URL: https://moniflow-sandbox-staging-git-rc-moni-312569-swifnatechnologyltd.vercel.app
      EXPO_PUBLIC_SUPABASE_URL: https://rtcjismwbrvulccryyau.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_SM3_8xbrUe2S1H5FSctY5w_xova1cwj
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin approved source and consume the single-use preview ticket
        shell: bash
        run: |
          set -euo pipefail
          TICKET=docs/RC_IPHONE_PWA_INTENT_LAB_ONE_SHOT_20261024.md
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$PREVIOUS_MAIN" = "$PINNED_APP_SOURCE"
          test "$(git rev-parse HEAD^)" = "$PINNED_APP_SOURCE"
          test -f "$TICKET"
          if git cat-file -e "$PREVIOUS_MAIN:$TICKET" 2>/dev/null; then
            echo "::error::The one-time PWA publishing ticket was already consumed."
            exit 1
          fi
          grep -Fxq 'Approval: ONE_EXPO_PWA_INTENT_LAB_UPDATE_20261024' "$TICKET"
          diff -u \
            <(printf '%s\n' '.github/workflows/iphone-pwa-intent-lab-once.yml' "$TICKET" | sort) \
            <(git diff --name-only "$PINNED_APP_SOURCE" HEAD | sort)
          git checkout --force --detach "$PINNED_APP_SOURCE"
          echo "Pinned MONIFlow PWA source: $PINNED_APP_SOURCE"
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install exact workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify the same Android/web product without native builds
        run: |
          pnpm typecheck
          pnpm test
      - name: Export the real Figma mobile routes as a static iPhone PWA
        run: pnpm --filter @moniflow/mobile build:web
      - name: Verify real installable assets and keep BMONI signer off web
        shell: bash
        run: |
          set -euo pipefail
          DIST=apps/mobile/dist
          test -f "$DIST/index.html"
          test -f "$DIST/manifest.webmanifest"
          test -s "$DIST/apple-touch-icon.png"
          test -s "$DIST/icon-192.png"
          test -s "$DIST/icon-512.png"
          grep -q 'manifest.webmanifest' "$DIST/index.html"
          grep -q 'apple-touch-icon' "$DIST/index.html"
          if grep -Eqi '(BMONI_API_KEY|PARTNER_HUSTLE_HMAC_SECRET|BMONI_IDENTITY_PHONE_HMAC_SECRET)' "$DIST/index.html"; then
            echo "::error::Financial backend configuration leaked to static HTML"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const d = 'apps/mobile/dist/';
          const m = JSON.parse(fs.readFileSync(d+'manifest.webmanifest','utf8'));
          if(m.display !== 'standalone' || m.scope !== '/' ||
             !m.name.includes('Sandbox') || m.icons.length !== 2)
            throw Error('PWA install metadata failed');
          console.log('PASS: static iOS install HTML, real app icons, sandbox manifest');
          NODE
      - name: Confirm API alias updated to JWT-owned Intent Lab endpoint
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          const api="https://moniflow-sandbox-staging-git-rc-moni-312569-swifnatechnologyltd.vercel.app";
          const r=await fetch(api+"/api/sandbox-demo/preview", {
            method:"POST",redirect:"manual",headers:{"content-type":"application/json"},
            body:"{}"
          });
          const payload=await r.json().catch(()=>null);
          if(r.status !== 401 || payload?.code !== "AUTH_REQUIRED") {
            throw Error("Existing iPhone sandbox API has not received the protected preview route");
          }
          console.log("PASS: stable isolated preview API supports JWT-guarded Intent Lab");
          NODE
      - name: Authenticate the previously connected Expo project
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish exactly one Expo Hosting PREVIEW (never production)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          eas project:info
          eas deploy --non-interactive --dev-domain xpen-moniflow-pwa-202610 --alias mvp-preview --environment preview --json > "$RUNNER_TEMP/eas-pwa-preview.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/eas-pwa-preview.json','utf8'));
          const entries=Array.isArray(raw)?raw:[raw];
          const urls=[];
          for(const x of entries) {
            for(const val of [x?.url,x?.deploymentUrl,x?.previewUrl,x?.deployment?.url,x?.deployment?.previewUrl]) {
              if(typeof val==='string' && val.startsWith('https://') && val.endsWith('.expo.app/')) urls.push(val);
              else if(typeof val==='string' && /^https:\/\/[^\s]+\.expo\.app\/?$/.test(val)) urls.push(val);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## MONIFlow iPhone PWA · Read-only Intent Lab Preview\n\n' +
            '- Application source: '+process.env.PINNED_APP_SOURCE+'\n'+
            '- Expo project: xpen/moniflow\n'+
            '- Preview URL(s): '+(urls.length?urls.join(', '):'See the EAS Hosting deployment details')+'\n'+
            '- No native build, wallet signing, bank funds, BMONI execution or production deployment\n');
          if (urls.length) console.log('MONIFLOW_PWA_PREVIEW_URL=' + urls[0]);
          console.log('Expo Hosting preview deployment request returned successfully.');
          NODE
