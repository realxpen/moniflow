name: MONIFlow CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Export mobile web bundle
        run: pnpm --filter @moniflow/mobile build:web

      - name: Test
        run: pnpm test

  b2-postgres-gate:
    name: B2 disposable PostgreSQL evidence and identity gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moniflow_ci
          POSTGRES_PASSWORD: disposable-ci-only-password
          POSTGRES_DB: moniflow_b2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moniflow_ci -d moniflow_b2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      MONIFLOW_B2_DISPOSABLE_DB_TESTS: "true"
      MONIFLOW_TEST_POSTGRES_URL: "postgres://moniflow_ci:disposable-ci-only-password@127.0.0.1:5432/moniflow_b2_ci"
      FINANCIAL_PROVIDER: moniflow-sandbox
      BMONI_PARTNER_ONBOARDING_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @moniflow/shared build && pnpm --filter @moniflow/moniguard build
      - name: Isolated PostgreSQL identity and receipt evidence
        run: pnpm exec vitest run apps/api/src/repositories/bmoni-identity-postgres.integration.test.ts --reporter=verbose
      - name: Isolated authenticated demo PostgreSQL ledger
        run: pnpm exec vitest run apps/api/src/services/sandbox-demo/workspace-store.postgres.integration.test.ts --reporter=verbose
      - name: Isolated PostgreSQL cross-instance financial preparation fence
        run: pnpm exec vitest run apps/api/src/repositories/execution-preparation-postgres.integration.test.ts --reporter=verbose

  native-release-evidence:
    name: Native readiness evidence (source-only, no build)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify safe native preview profiles and evidence policy
        run: |
          node --test scripts/native-release-evidence.nodecheck.mjs
          node --test scripts/post-figma-android-apk.nodecheck.mjs
          node --test scripts/post-figma-waydroid-x86.nodecheck.mjs
          node --test scripts/post-pr65-waydroid-x86.nodecheck.mjs
          node --test scripts/android-apk-preview.nodecheck.mjs scripts/phase33a-android-apk.nodecheck.mjs scripts/waydroid-x86-preview.nodecheck.mjs
      - name: Record source-only release evidence
        run: node scripts/native-release-evidence.mjs --output "$RUNNER_TEMP/moniflow-native-readiness/report.json"
      - name: Publish non-secret release evidence
        uses: actions/upload-artifact@v4
        with:
          name: moniflow-native-source-evidence
          path: ${{ runner.temp }}/moniflow-native-readiness/report.json
          retention-days: 14
          if-no-files-found: error
